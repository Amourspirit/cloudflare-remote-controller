[project]
name = "cloudflare-remote-controller"
version = "0.1.0"
description = "Docker-event-driven Cloudflare DNS CNAME route controller"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "docker>=7.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.8.0",
    "tenacity>=9.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]