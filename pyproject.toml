[project]
name = "cloudflare-remote-controller"
version = "0.1.0"
description = "Docker-event-driven Cloudflare DNS CNAME route controller"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "docker>=7.0.0",
    "httpx>=0.28.0",
    "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
    "tenacity>=9.0.0"
]

  [project.scripts]
  cfroute-controller = "controller.main:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0"
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
controller = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["docker", "docker.*"]
ignore_missing_imports = true